name: PSI Sovereign scoped-delegation CI

on:
  push:
    branches:
      - gpt/psi-sovereign-policy-vnext-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install only test runner
        run: python -m pip install pytest
      - name: Test PSI local policy engine and lifecycle
        run: python -m pytest -q tests/test_psi_policy.py
      - name: Syntax check historical files without importing cloud clients
        run: |
          python -m py_compile qbrain9_sovereign_core.py supabase_bridge.py supabase_bridge_v2.py
